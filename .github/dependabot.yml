version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    versioning-strategy: increase-if-necessary
    ignore:
      # 2.x drops AgentSideConnection; libs/acp needs a migration first
      - dependency-name: "@agentclientprotocol/sdk"
        update-types: ["version-update:semver-major"]
    groups:
      patch-deps-updates-main:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-deps-updates-main:
        patterns:
          - "*"
        update-types:
          - "minor"
      major-deps-updates-main:
        patterns:
          - "*"
        update-types:
          - "major"
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      patch-deps-updates:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-deps-updates:
        patterns:
          - "*"
        update-types:
          - "minor"
      major-deps-updates:
        patterns:
          - "*"
        update-types:
          - "major"

  - package-ecosystem: docker
    directory: "/examples/async-subagent-server"
    schedule:
      interval: monthly
    open-pull-requests-limit: 10
    groups:
      patch-deps-updates-docker:
        patterns:
          - "*"
        update-types:
          - "patch"
      minor-deps-updates-docker:
        patterns:
          - "*"
        update-types:
          - "minor"
      major-deps-updates-docker:
        patterns:
          - "*"
        update-types:
          - "major"
